<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A --deep review run</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="scene"></canvas>

<button class="start" id="start" type="button">
  <span class="start-badge">&#9654;</span>
  <span class="start-label">Play the run</span>
  <span class="start-note">nine agents, twelve refuters, one report</span>
</button>

<noscript>
  <p style="position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;color:#37424c;background:#dfe6ea;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    This diagram is an interactive simulation and needs JavaScript. The same
    run is written out in full in the report below the diagram.
  </p>
</noscript>

<div class="hud hud-top">
  <div class="bar">
    <button id="play" type="button" class="is-primary">&#9654; Play</button>
    <button id="speed" type="button">2&times;</button>
    <button id="restart" type="button">Restart</button>
  </div>
  <ol id="steps" class="steps"></ol>
</div>

<div class="hud hud-copy">
  <h1 id="st-title">Intake</h1>
  <p id="st-body"></p>
</div>

<div class="hud hud-counts">
  <h2>The run so far</h2>
  <div id="counts"></div>
</div>


<script src="js/iso.js"></script>
<script src="js/model.js"></script>
<script src="js/world.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
