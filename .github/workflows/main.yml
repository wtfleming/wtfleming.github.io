name: Build and deploy org-mode blog on GH Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Publish site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to commit SHAs, not tags or branches: this job holds
      # contents: write, so a mutable ref would let an upstream compromise push
      # to this repository. Comments record the human-readable version.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Emacs
        uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master @ 2026-08-01
        with:
          version: '30.1'

      - name: Build site
        run: emacs --batch -l publish.el

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
