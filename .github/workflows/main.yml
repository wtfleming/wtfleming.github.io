name: Build and deploy org-mode blog on GH Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Publish site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to commit SHAs, not tags or branches: this job holds
      # contents: write, so a mutable ref would let an upstream compromise push
      # to this repository. Comments record the human-readable version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: '30.1'

      - name: Build site
        run: emacs --batch -l publish.el

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
